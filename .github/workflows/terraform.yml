name: Terraform CI/CD

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read
  pull-requests: write # Required to post plan comments

env:
  TF_VERSION: "1.14.0"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve which environment + tfvars to use based on the target branch
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      workspace: ${{ steps.env.outputs.workspace }}
      tfvars: ${{ steps.env.outputs.tfvars }}
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          case "$BRANCH" in
            dev)
              echo "environment=development" >> $GITHUB_OUTPUT
              echo "workspace=development"   >> $GITHUB_OUTPUT
              echo "tfvars=envs/dev.tfvars"  >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "environment=staging"         >> $GITHUB_OUTPUT
              echo "workspace=staging"           >> $GITHUB_OUTPUT
              echo "tfvars=envs/staging.tfvars"  >> $GITHUB_OUTPUT
              ;;
            main)
              echo "environment=production"     >> $GITHUB_OUTPUT
              echo "workspace=production"       >> $GITHUB_OUTPUT
              echo "tfvars=envs/prod.tfvars"    >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown branch: $BRANCH"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # terraform plan — runs on every push and PR
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}

    env:
      # Sensitive tfvars values injected as TF_VAR_* — Terraform reads these automatically
      TF_VAR_r2_secret_access_key: ${{ secrets.TF_VAR_R2_SECRET_ACCESS_KEY }}
      TF_VAR_r2_access_key_id: ${{ secrets.TF_VAR_R2_ACCESS_KEY_ID }}
      TF_VAR_worker_jwt_secret: ${{ secrets.TF_VAR_WORKER_JWT_SECRET }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select or Create Workspace
        run: terraform workspace select -or-create ${{ needs.setup.outputs.workspace }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=${{ needs.setup.outputs.tfvars }} \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.setup.outputs.workspace }}
          path: tfplan
          retention-days: 1

      # Post plan output as a sticky PR comment (updates existing comment on re-runs)
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          message: |
            ### Terraform Plan — `${{ needs.setup.outputs.environment }}`
            <details><summary>Show Plan</summary>

            ```hcl
            ${{ steps.plan.outputs.stdout }}
            ```
            </details>

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # terraform apply — only on push (after merge), never on PRs
  # Production requires manual approval via GitHub Environment protection rules
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Terraform Apply (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [ setup, terraform-plan ]
    if: github.event_name == 'push'
    environment: ${{ needs.setup.outputs.environment }}

    env:
      TF_VAR_r2_secret_access_key: ${{ secrets.TF_VAR_R2_SECRET_ACCESS_KEY }}
      TF_VAR_r2_access_key_id: ${{ secrets.TF_VAR_R2_ACCESS_KEY_ID }}
      TF_VAR_worker_jwt_secret: ${{ secrets.TF_VAR_WORKER_JWT_SECRET }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select ${{ needs.setup.outputs.workspace }}

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ needs.setup.outputs.workspace }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
